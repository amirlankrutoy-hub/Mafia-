<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgAdmin" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#2a2005"/>
      <stop offset="100%" stop-color="#08060a"/>
    </radialGradient>
    <linearGradient id="goldAdmin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="45%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#a97c00"/>
    </linearGradient>
    <linearGradient id="coatAdmin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bgAdmin)"/>

  <!-- сияние за головой -->
  <circle cx="100" cy="105" r="72" fill="url(#goldAdmin)" opacity="0.12"/>

  <!-- плечи / пиджак -->
  <path d="M30 200 Q100 138 170 200 Z" fill="url(#coatAdmin)"/>
  <path d="M78 150 L100 168 L122 150 L114 200 L86 200 Z" fill="#f3e5ab"/>
  <path d="M92 155 L100 172 L108 155 Z" fill="url(#goldAdmin)"/>

  <!-- лицо -->
  <ellipse cx="100" cy="106" rx="38" ry="42" fill="#d9b48f"/>
  <ellipse cx="82" cy="110" rx="5.5" ry="6.5" fill="#1a1a1a"/>
  <ellipse cx="118" cy="110" rx="5.5" ry="6.5" fill="#1a1a1a"/>
  <circle cx="83.5" cy="108" r="1.4" fill="#fff"/>
  <circle cx="119.5" cy="108" r="1.4" fill="#fff"/>
  <path d="M70 100 Q82 92 94 100" stroke="#3d3223" stroke-width="2.2" fill="none"/>
  <path d="M106 100 Q118 92 130 100" stroke="#3d3223" stroke-width="2.2" fill="none"/>
  <path d="M91 118 Q100 126 109 118" stroke="#8a6244" stroke-width="2" fill="none"/>
  <path d="M84 136 Q100 146 116 136" stroke="#5c3d28" stroke-width="3" fill="none"/>

  <!-- корона -->
  <g>
    <path
      d="M52 78 L64 34 L82 58 L100 22 L118 58 L136 34 L148 78 Z"
      fill="url(#goldAdmin)"
      stroke="#5c4300"
      stroke-width="2.5"
      stroke-linejoin="round"
    />
    <rect x="52" y="76" width="96" height="14" rx="3" fill="url(#goldAdmin)" stroke="#5c4300" stroke-width="2.5"/>
    <circle cx="64" cy="36" r="5" fill="#ff2d55" stroke="#5c4300" stroke-width="1"/>
    <circle cx="100" cy="24" r="6" fill="#3ddcff" stroke="#5c4300" stroke-width="1"/>
    <circle cx="136" cy="36" r="5" fill="#4dff88" stroke="#5c4300" stroke-width="1"/>
    <circle cx="82" cy="60" r="3.2" fill="#fff" opacity="0.9"/>
    <circle cx="118" cy="60" r="3.2" fill="#fff" opacity="0.9"/>
  </g>

  <!-- лента ADMIN -->
  <rect x="58" y="176" width="84" height="18" rx="3" fill="#8b0000" stroke="#3a0000" stroke-width="1.5"/>
  <text
    x="100"
    y="190"
    text-anchor="middle"
    font-size="12"
    font-weight="900"
    fill="#f3e5ab"
    font-family="Georgia, serif"
    letter-spacing="1.5"
  >ADMIN</text>
</svg>
