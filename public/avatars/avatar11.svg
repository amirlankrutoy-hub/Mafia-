<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c100b"/>
      <stop offset="50%" style="stop-color:#120a07"/>
      <stop offset="100%" style="stop-color:#080402"/>
    </linearGradient>
    <linearGradient id="gold11" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#daa520"/>
      <stop offset="100%" style="stop-color:#8b6914"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="200" height="200" fill="url(#bg11)"/>
  <!-- gold border -->
  <rect x="6" y="6" width="188" height="188" fill="none" stroke="#daa520" stroke-width="3" rx="12" opacity="0.7"/>
  <!-- inner thin border -->
  <rect x="14" y="14" width="172" height="172" fill="none" stroke="#daa520" stroke-width="1" rx="8" opacity="0.35"/>
  <!-- head silhouette -->
  <circle cx="100" cy="78" r="36" fill="#0a0503" stroke="#daa520" stroke-width="2"/>
  <!-- shoulders -->
  <ellipse cx="100" cy="165" rx="58" ry="42" fill="#0a0503" stroke="#daa520" stroke-width="2"/>
  <!-- monogram -->
  <text x="100" y="92" text-anchor="middle" font-size="42" fill="url(#gold11)" font-family="Georgia, serif" font-weight="bold">K</text>
  <!-- small decorative dots -->
  <circle cx="40" cy="40" r="2.5" fill="#daa520" opacity="0.5"/>
  <circle cx="160" cy="40" r="2.5" fill="#daa520" opacity="0.5"/>
  <circle cx="40" cy="160" r="2.5" fill="#daa520" opacity="0.5"/>
  <circle cx="160" cy="160" r="2.5" fill="#daa520" opacity="0.5"/>
</svg>
